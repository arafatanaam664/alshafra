# تحديث بيانات الموقع وإعادة نشر الصفحات الجاهزة ثلاث مرات يومياً.
name: Daily auto-publish

on:
  schedule:
    - cron: '30 4 * * *'
    - cron: '30 12 * * *'
    - cron: '30 20 * * *'
  workflow_dispatch:

permissions:
  contents: write

# يمنع تشغيل نسختين متزامنتين من المهمة ودفع commitين متعارضين إلى main.
concurrency:
  group: daily-auto-publish-main
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch live gold and FX prices
        run: node scripts/fetch-prices.mjs

      - name: Refresh optional GCC trends snapshot
        run: node scripts/fetch-trending.mjs

      - name: Build and run SEO quality checks
        run: npm run build

      - name: Commit generated data
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "shafra-bot"
          git config user.email "bot@alshafra.com"

          # لا نمرر مساراً مفقوداً إلى git add؛
          # pathspec مفقود هو سبب الفشل السابق.
          generated_files=(
            src/data/prices.json
            src/data/trending-snapshot.json
            public/published.json
            public/4f9c2a7e1b8d3f6a9c0e5b7d2a8f4c1e.txt
          )

          for file in "${generated_files[@]}"; do
            if [[ -e "$file" ]]; then
              git add -- "$file"
            else
              echo "Optional generated file is absent: $file"
            fi
          done

          if git diff --cached --quiet; then
            echo "No generated data changed."
          else
            git commit -m "chore: refresh prices and published pages $(date -u +%F)"
            git push origin HEAD:main
            echo "Generated data committed; the hosting service can rebuild."
          fi

      - name: Submit newly published pages to IndexNow
        run: node scripts/indexnow.mjs

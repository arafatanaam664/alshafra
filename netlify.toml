# This branch follows the chat plan: public site is Astro SSG (`apps/web`).
# Host today is still Vercel; Cloudflare Pages is the later cutover, not a second renderer.
# Vite (`apps/web-legacy`) stays as rollback. Do not delete it.
[build]
  command = "npm run build"
  publish = "apps/web/dist"

# NOTE: every valid route is emitted as a real static file by
# `scripts/prerender.mjs`, so there is deliberately NO catch-all
# `/* -> /index.html 200` rule here. A missing URL must return a genuine 404
# (or 410) instead of a 200 with an empty SPA shell, otherwise Google keeps
# thousands of ghost URLs from the site's previous incarnation in its index.

# Old, unrelated pages from the previous site — 410 Gone so Google drops them fast.
[[redirects]]
  from = "/category/*"
  to = "/410.html"
  status = 410

[[redirects]]
  from = "/languages/*"
  to = "/410.html"
  status = 410

[[redirects]]
  from = "/news/*"
  to = "/410.html"
  status = 410

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=3600"
